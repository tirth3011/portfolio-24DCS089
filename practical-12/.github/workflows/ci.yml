name: AWDF CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Code Quality & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'tirth-portfolio/practical-12/backend/package.json'

      - name: Install Dependencies
        working-directory: tirth-portfolio/practical-12/backend
        run: npm install

      - name: Run ESLint Syntax Check
        working-directory: tirth-portfolio/practical-12/backend
        run: npm run lint

  test:
    name: Automated Unit & Integration Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'tirth-portfolio/practical-12/backend/package.json'

      - name: Install Dependencies
        working-directory: tirth-portfolio/practical-12/backend
        run: npm install

      - name: Run Automated Test Suite
        working-directory: tirth-portfolio/practical-12/backend
        run: npm test

  build:
    name: Production Build Verification
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Verify Build
        run: echo "✔ Production Build Verified Successfully for Practical 12"
